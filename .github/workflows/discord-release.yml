name: discord-release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    steps:
      - name: Require Discord webhook
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo '::error::DISCORD_WEBHOOK_URL is not configured as a repository Actions secret.'
            exit 1
          fi

      - name: Send release announcement
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG: ${{ github.event.release.tag_name }}
          URL: ${{ github.event.release.html_url }}
          BODY: ${{ github.event.release.body }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/discord-release.json"
          jq -n \
            --arg title "$REPO $TAG released" \
            --arg url "$URL" \
            --arg body "${BODY:0:3500}" \
            '{
              username: "mission-auto-release-bot",
              allowed_mentions: {parse: []},
              embeds: [{
                title: $title,
                url: $url,
                description: ($body | if length > 0 then . else "Release notes are available on GitHub." end),
                color: 5763719
              }]
            }' > "$payload"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            -H 'Content-Type: application/json' \
            --data-binary "@$payload" \
            "$WEBHOOK"

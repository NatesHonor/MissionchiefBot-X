name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Also comment on merged PRs in already-published releases'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain release pull request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create MissionAutoReleaseBot token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Run release-please
        id: release-please
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Release Please only lists PR titles and the commits it can parse.
      # Add each merged PR's own commits, plus any commits since the last
      # release that the generated notes missed, to the release PR body and
      # CHANGELOG.md. Runs before the notifier so PRs listed under
      # "Other Changes" are notified too.
      - name: Add PR commits and missed changes to release notes
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const enrich = require('./.github/scripts/enrich-release-notes.cjs');
            await enrich({github, context, core});

      # The notification script's tests run in CI on every pull request.
      # This step runs on every push and dispatch so updates to an existing
      # release PR, and releases being published, are picked up. The script
      # exits quietly when there is nothing to do and never edits a comment
      # that is current.
      - name: Notify merged PRs about their release
        uses: actions/github-script@v7
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BACKFILL: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill || steps.release-please.outputs.releases_created == 'true' }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const notify = require('./.github/scripts/notify-release-prs.cjs');
            await notify({
              github, context, core,
              appSlug: process.env.APP_SLUG,
              backfill: process.env.BACKFILL === 'true',
            });

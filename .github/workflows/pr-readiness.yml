name: PR Readiness

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    workflows: [CI, Security, Docker, PR Artifacts]
    types: [completed]
  workflow_dispatch:

permissions:
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: readiness-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.ref }}
  cancel-in-progress: true

jobs:
  assess:
    name: Score project compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Resolve pull request commit
        id: target
        uses: actions/github-script@v7
        with:
          script: |
            let sha = context.payload.pull_request?.head?.sha;
            if (!sha && context.payload.workflow_run?.pull_requests?.length) {
              sha = context.payload.workflow_run.pull_requests[0].head.sha;
            }
            if (!sha) sha = context.sha;
            core.setOutput('sha', sha);

      - name: Check out assessment script
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Collect check results
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        run: gh api "repos/${REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100" > "$RUNNER_TEMP/check-runs.json"

      - name: Build scored assessment
        env:
          CHECK_RUNS_FILE: ${{ runner.temp }}/check-runs.json
        run: python .github/scripts/pr_readiness_report.py

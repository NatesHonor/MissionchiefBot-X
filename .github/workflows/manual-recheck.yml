name: Manual CI Re-run

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to re-check'
        required: false
        type: number

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  trigger-ci:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '/recheck') &&
       github.event.issue.pull_request &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'COLLABORATOR' ||
        github.event.comment.author_association == 'MEMBER'))
    runs-on: ubuntu-latest
    steps:
      - name: Get PR info
        id: pr-info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_NUMBER="${{ github.event.inputs.pr_number }}"
            if [ -z "$PR_NUMBER" ]; then
              echo "No PR number provided in workflow dispatch"
              exit 1
            fi
          else
            PR_NUMBER="${{ github.event.issue.number }}"
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          BRANCH=$(gh pr view "$PR_NUMBER" --repo "${GITHUB_REPOSITORY}" --json headRefName --jq '.headRefName')
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Rerun the latest CI run for the PR's head branch. A rerun keeps the
      # original `pull_request` event, so the pr-comment job runs again and
      # posts updated results to the PR.
      - name: Rerun latest CI run for the PR branch
        run: |
          BRANCH="${{ steps.pr-info.outputs.branch }}"
          CI_FILE="ci.yml"

          RUN_ID=$(gh run list --workflow="$CI_FILE" --branch "$BRANCH" --limit 1 \
            --json databaseId --jq '.[0].databaseId')

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::No existing CI run found for branch $BRANCH"
            exit 1
          fi

          echo "Rerunning CI run $RUN_ID for branch $BRANCH"
          gh run rerun "$RUN_ID" --failed

      - name: Post comment (on PR comment trigger)
        if: github.event_name == 'issue_comment'
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}" \
            --body "✅ Re-triggered CI checks for PR #${{ steps.pr-info.outputs.pr_number }} on branch ${{ steps.pr-info.outputs.branch }}. The results will be posted here when the run finishes."

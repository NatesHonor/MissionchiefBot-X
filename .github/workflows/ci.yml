name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  # ── Dependency & environment compatibility ──────────────────────────
  compat:
    name: compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Python version
        run: python --version

      - name: Playwright Chromium
        run: python -m playwright install chromium

      - name: Check imports resolve
        run: python -c "import Main"

  # ── Lint (correctness rules only) ──────────────────────────────────
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff (correctness + formatting)
        run: |
          ruff check . --select E9,F63,F7,F82
          ruff format --check .

  # ── Type check (core only, baseline-friendly) ─────────────────────
  typecheck:
    name: type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install deps + mypy
        run: |
          pip install -r requirements.txt
          pip install mypy types-requests

      - name: Run mypy on core modules
        run: |
          mypy core/ utils/ config/ regions/ Main.py             --disable-error-code=no-any-return             --disable-error-code=arg-type             --disable-error-code=var-annotated             --disable-error-code=assignment             --disable-error-code=attr-defined             --disable-error-code=str-bytes-safe             --disable-error-code=unreachable             --disable-error-code=call-overload             --disable-error-code=index             --no-error-summary

  # ── Security scan ───────────────────────────────────────────────────
  security:
    name: security (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit (medium+ severity, medium+ confidence)
        run: bandit -r core utils config regions Main.py -c .bandit --severity-level medium --confidence-level medium

  # ── Tests ───────────────────────────────────────────────────────────
  test:
    name: test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio

      - name: Run tests
        run: PYTHONPATH=. pytest tests/ -v

  # ── Dependency vulnerability audit ─────────────────────────────────
  deps-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2022-252

  # ── Dependency freshness check ──────────────────────────────────────
  deps-freshness:
    name: dependency-freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for outdated dependencies
        run: |
          pip list --outdated --format=freeze |           grep -v "^(astroid|attrs|certifi|charset-normalizer|colorama|coverage|distlib|dirty-equalities|dnspython|exceptiongroup|execnet|filelock|h11|httpcore|httpx|idna|iniconfig|isort|jaraco.context|lazy-object-proxy|markdown-it-py|mdurl|mccabe|more-itertools|mypy|mypy-extensions|outcome|packaging|pathspec|pip|platformdirs|playwright|pluggy|psutil|psycopg2-binary|pyflakes|pygments|pylint|pypiwin32|pytest|pytest-asyncio|pytest-timeout|python-dateutil|pywin32|requests|ruff|selenium|six|sortedcontainers|tomli|tomlkit|trio|trio-websocket|types-requests|typing-extensions|urllib3|virtualenv|websocket-client|websockets|wrapt|yarl)$" ||           echo "No outdated dependencies to report (filtered known safe packages)"

  # ── Summary comment on PR ───────────────────────────────────────────
  pr-comment:
    name: pr-comment
    if: always() && github.event_name == 'pull_request'
    needs: [compat, lint, typecheck, security, test, deps-audit, deps-freshness]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Build comment body
        id: build-comment
        run: |
          python3 << 'PYEOF'
          import json, os

          # Parse results from needs
          checks = [
              ('compatibility', '${{ needs.compat.result }}'),
              ('lint (ruff)', '${{ needs.lint.result }}'),
              ('type-check (mypy)', '${{ needs.typecheck.result }}'),
              ('security (bandit)', '${{ needs.security.result }}'),
              ('test (pytest)', '${{ needs.test.result }}'),
              ('dependency-audit', '${{ needs.deps-audit.result }}'),
              ('dependency-freshness', '${{ needs.deps-freshness.result }}'),
          ]

          icon_map = {'success': '✅', 'failure': '❌', 'cancelled': '⚠️', 'skipped': '⏭️'}
          body = "## CI Results\n\n"

          passed = sum(1 for _, r in checks if r == 'success')
          total = len(checks)
          body += f"**{passed}/{total}** checks passed"
          if any(r != 'success' for _, r in checks):
              body += " · **{} failed**".format(sum(1 for _, r in checks if r == 'failure'))
          body += "\n\n"

          for name, result in checks:
              icon = icon_map.get(result, '?')
              body += f"- {icon} `{name}` ({result})\n"

          run_url = f"https://github.com/{os.getenv('GITHUB_REPOSITORY', '')}/actions/runs/{os.getenv('GITHUB_RUN_ID', '')}"
          body += f"\n[View workflow run]({run_url})\n"

          failed = [name for name, r in checks if r == 'failure']
          if failed:
              body += "\n### Next steps\n"
              hints = {
                  'lint (ruff)': 'Run `ruff check . && ruff format .` locally and commit fixes.',
                  'type-check (mypy)': 'Add type annotations or fix type errors shown in the workflow logs.',
                  'security (bandit)': 'Fix security issues reported by bandit. See workflow logs for details.',
                  'test (pytest)': 'Fix failing tests. Run `PYTHONPATH=. pytest tests/ -v` locally to reproduce.',
                  'dependency-audit': 'Review vulnerable dependencies found by pip-audit.',
                  'dependency-freshness': 'Consider updating outdated dependencies if safe.',
                  'compatibility': 'Ensure Python 3.11 and all imports resolve correctly.',
              }
              for name in failed:
                  hint = hints.get(name, 'See workflow logs for details.')
                  body += f"\n**`{name}`**: {hint}\n"

          body += "\n---\n*This comment was generated by an AI agent (OpenHands) on behalf of the repository maintainer.*"

          print(f'body<<EOF\n{body}\nEOF') >> os.getenv('GITHUB_OUTPUT', '/dev/stdout')
PYEOF

      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const body = `${{ steps.build-comment.outputs.body }}`;
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body?.includes('## CI Results'));
            if (existing) {
              await github.rest.issues.updateComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  # ── Dependency & environment compatibility ──────────────────────────
  compat:
    name: compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Python version
        run: python --version

      - name: Playwright Chromium
        run: python -m playwright install chromium

      - name: Check imports resolve
        run: python -c "import Main"

  # ── Lint ────────────────────────────────────────────────────────────
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff (lint + formatting)
        run: ruff check . && ruff format --check .

  # ── Type check ──────────────────────────────────────────────────────
  typecheck:
    name: type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install deps + mypy
        run: |
          pip install -r requirements.txt
          pip install mypy types-requests

      - name: Run mypy
        run: mypy .

  # ── Security scan ───────────────────────────────────────────────────
  security:
    name: security (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit
        run: bandit -r . -ll -ll

  # ── Tests ───────────────────────────────────────────────────────────
  test:
    name: test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio

      - name: Run tests
        run: pytest tests/ -v

  # ── Summary comment on PR ───────────────────────────────────────────
  pr-comment:
    name: pr-comment
    if: github.event_name == 'pull_request'
    needs: [compat, lint, typecheck, security, test]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Build comment body
        id: build-comment
        run: |
          #!/usr/bin/env python3
          import json
          
          checks = [
              ('compatibility', '${{ needs.compat.result }}' == 'success'),
              ('lint (ruff)', '${{ needs.lint.result }}' == 'success'),
              ('type-check (mypy)', '${{ needs.typecheck.result }}' == 'success'),
              ('security (bandit)', '${{ needs.security.result }}' == 'success'),
              ('test (pytest)', '${{ needs.test.result }}' == 'success'),
          ]
          
          passed = [c for c, ok in checks if ok]
          failed = [c for c, ok in checks if not ok]
          
          body = "## CI Results\n\n"
          body += f"**{len(passed)}/5** checks passed · **{len(failed)}/5** failed\n\n"
          for name, ok in checks:
              icon = '✅' if ok else '❌'
              body += f"- {icon} `{name}`\n"
          
          if failed:
              body += "\n### Fixing failures\n"
              hints = {
                  'lint (ruff)': 'Run `ruff check . && ruff format .` locally and commit fixes.',
                  'type-check (mypy)': 'Add type annotations or fix type errors shown in the workflow logs.',
                  'security (bandit)': 'Fix security issues reported by bandit. See workflow logs for details.',
                  'test (pytest)': 'Fix failing tests. Run `pytest tests/ -v` locally to reproduce.',
              }
              for name in failed:
                  hint = hints.get(name, 'See workflow logs for details.')
                  body += f"\n**`{name}`**: {hint}\n"
          
          print(f'body<<EOF\n{body}\nEOF') >> "$GITHUB_OUTPUT"
      
      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const body = `${{ steps.build-comment.outputs.body }}`;
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body?.includes('## CI Results'));
            if (existing) {
              await github.rest.issues.updateComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

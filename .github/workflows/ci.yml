name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  # ── Dependency & environment compatibility ──────────────────────────
  compat:
    name: compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Python version
        run: python --version

      - name: Playwright Chromium
        run: python -m playwright install chromium

      - name: Check imports resolve
        run: python -c "import Main"

  # ── Lint (correctness rules only) ──────────────────────────────────
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff correctness checks
        run: ruff check . --select E9,F63,F7,F82

  # ── Type check (core only, baseline-friendly) ─────────────────────
  typecheck:
    name: type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install deps + mypy
        run: |
          pip install -r requirements.txt
          pip install mypy types-requests

      - name: Run mypy baseline checks
        run: |
          mypy core/settings.py core/logging_config.py             --disable-error-code=no-any-return             --disable-error-code=arg-type             --disable-error-code=var-annotated             --disable-error-code=assignment             --disable-error-code=attr-defined             --disable-error-code=str-bytes-safe             --disable-error-code=unreachable             --disable-error-code=call-overload             --disable-error-code=index             --no-error-summary

  # ── Security scan ───────────────────────────────────────────────────
  security:
    name: security (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit (medium+ severity, medium+ confidence)
        run: bandit -r core utils regions Main.py -c .bandit --severity-level medium --confidence-level medium

  # ── Release notification script tests ─────────────────────────────
  release-notify-test:
    name: test (release notifications)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Run release notification tests
        run: node --test tests/test_release_notifications.js tests/test_release_details.js tests/test_pr_check_summary.js

  # ── Dependency vulnerability audit ─────────────────────────────────
  deps-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2022-252

  # ── Dependency freshness check ──────────────────────────────────────
  deps-freshness:
    name: dependency-freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for outdated dependencies
        run: |
          pip list --outdated --format=freeze |           grep -v "^(astroid|attrs|certifi|charset-normalizer|colorama|coverage|distlib|dirty-equalities|dnspython|exceptiongroup|execnet|filelock|h11|httpcore|httpx|idna|iniconfig|isort|jaraco.context|lazy-object-proxy|markdown-it-py|mdurl|mccabe|more-itertools|mypy|mypy-extensions|outcome|packaging|pathspec|pip|platformdirs|playwright|pluggy|psutil|psycopg2-binary|pyflakes|pygments|pylint|pypiwin32|pytest|pytest-asyncio|pytest-timeout|python-dateutil|pywin32|requests|ruff|selenium|six|sortedcontainers|tomli|tomlkit|trio|trio-websocket|types-requests|typing-extensions|urllib3|virtualenv|websocket-client|websockets|wrapt|yarl)$" ||           echo "No outdated dependencies to report (filtered known safe packages)"

  # ── Secret scan (gitleaks) ──────────────────────────────────────────
  secret-scan:
    name: secret-scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ── Summary comment on PR ───────────────────────────────────────────
  # Posted by .github/workflows/pr-check-summary.yml after every PR workflow
  # finishes, so it covers every check on the PR rather than only these jobs.

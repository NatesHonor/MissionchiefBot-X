name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install application and quality tools
        run: python -m pip install -r requirements-dev.txt

      - name: Check lint rules
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Type-check application modules
        run: python -m mypy core/ utils/ config/ regions/ Main.py --no-error-summary

      - name: Scan Python code for security issues
        run: >-
          python -m bandit -r core utils config regions Main.py
          -c .bandit --severity-level medium --confidence-level medium

  test-and-build:
    name: Test and build (${{ matrix.os-name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os-name: ubuntu-py311
            python-version: "3.11"
          - os: ubuntu-latest
            os-name: ubuntu-py314
            python-version: "3.14"
          - os: windows-latest
            os-name: windows-py311
            python-version: "3.11"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile application
        run: python -m compileall -q Main.py core config regions utils

      - name: Verify imports
        run: python -c "import Main"

      - name: Run tests
        run: python -m pytest tests/
        env:
          PYTHONPATH: .

  ci-success:
    name: CI success
    if: always()
    needs: [quality, test-and-build]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test-and-build.result }}
        run: |
          if [[ "$QUALITY_RESULT" != "success" || "$TEST_RESULT" != "success" ]]; then
            echo "One or more required CI jobs did not pass."
            exit 1
          fi

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Python version
        run: python --version

      - name: Playwright Chromium
        run: python -m playwright install chromium

      - name: Check imports resolve
        run: python -c "import Main"

  # ── Lint (correctness rules only) ──────────────────────────────────
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff correctness checks
        run: ruff check . --select E9,F63,F7,F82

  # ── Type check (core only, baseline-friendly) ─────────────────────
  typecheck:
    name: type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install deps + mypy
        run: |
          pip install -r requirements.txt
          pip install mypy types-requests

      - name: Run mypy baseline checks
        run: |
          mypy core/settings.py core/logging_config.py             --disable-error-code=no-any-return             --disable-error-code=arg-type             --disable-error-code=var-annotated             --disable-error-code=assignment             --disable-error-code=attr-defined             --disable-error-code=str-bytes-safe             --disable-error-code=unreachable             --disable-error-code=call-overload             --disable-error-code=index             --no-error-summary

  # ── Security scan ───────────────────────────────────────────────────
  security:
    name: security (bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile application
        run: python -m compileall -q Main.py core config regions utils

      - name: Verify imports
        run: python -c "import Main"

      - name: Run tests when present
        shell: bash
        run: |
          if [ -d tests ]; then
            python -m pytest tests/
          else
            echo "No tests directory is present; skipping pytest."
          fi
        env:
          PYTHONPATH: .

  ci-success:
    name: CI success
    if: always()
    needs: [quality, test-and-build]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test-and-build.result }}
        run: |
          if [[ "$QUALITY_RESULT" != "success" || "$TEST_RESULT" != "success" ]]; then
            echo "One or more required CI jobs did not pass."
            exit 1
          fi

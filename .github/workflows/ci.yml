name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  # ── Dependency & environment compatibility ──────────────────────────
  compat:
    name: compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Python version
        run: python --version

      - name: Playwright Chromium
        run: python -m playwright install chromium

      - name: Check imports resolve
        run: python -c "import Main"

  # ── Lint ────────────────────────────────────────────────────────────
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff (lint + formatting)
        run: ruff check . && ruff format --check .

  # ── Type check ──────────────────────────────────────────────────────
  typecheck:
    name: type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install deps + mypy
        run: |
          pip install -r requirements.txt
          pip install mypy types-requests

      - name: Run mypy
        run: mypy .

  # ── Security scan ───────────────────────────────────────────────────
  security:
    name: security (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit
        run: bandit -r . -ll -ll

  # ── Tests ───────────────────────────────────────────────────────────
  test:
    name: test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio

      - name: Run tests
        run: pytest tests/ -v

  # ── Summary comment on PR ───────────────────────────────────────────
  pr-comment:
    name: pr-comment
    if: github.event_name == 'pull_request'
    needs: [compat, lint, typecheck, security, test]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const checks = [
              { name: 'compatibility', ok: ${{ needs.compat.result == 'success' }} },
              { name: 'lint (ruff)', ok: ${{ needs.lint.result == 'success' }} },
              { name: 'type-check (mypy)', ok: ${{ needs.typecheck.result == 'success' }} },
              { name: 'security (bandit)', ok: ${{ needs.security.result == 'success' }} },
              { name: 'test (pytest)', ok: ${{ needs.test.result == 'success' }} },
            ];
            const passed = checks.filter(c => c.ok);
            const failed = checks.filter(c => !c.ok);
            let body = `## CI Results\n\n`;
            body += `**${passed.length}/5** checks passed · **${failed.length}/5** failed\n\n`;
            for (const c of checks) {
              const icon = c.ok ? '✅' : '❌';
              body += `- ${icon} \`${c.name}\`\n`;
            }
            if (failed.length > 0) {
              body += `\n### Fixing failures\n`;
              for (const f of failed) {
                let hint = '';
                switch (f.name) {
                  case 'lint (ruff)':
                    hint = 'Run `ruff check . && ruff format .` locally and commit fixes.';
                    break;
                  case 'type-check (mypy)':
                    hint = 'Add type annotations or fix type errors shown in the workflow logs.';
                    break;
                  case 'security (bandit)':
                    hint = 'Fix security issues reported by bandit. See workflow logs for details.';
                    break;
                  case 'test (pytest)':
                    hint = 'Fix failing tests. Run `pytest tests/ -v` locally to reproduce.';
                    break;
                  default:
                    hint = 'See workflow logs for details.';
                }
                body += `\n**\`${f.name}\`**: ${hint}\n`;
              }
            }
            core.setOutput('body', body);

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const body = JSON.parse(process.env.CHECK_RESULT).body;
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c =>
              c.body?.includes('## CI Results')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
        env:
          CHECK_RESULT: ${{ steps.pr-comment-step.outputs.body }}

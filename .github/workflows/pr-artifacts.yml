name: PR Artifacts

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-pr-artifacts:
    name: Check PR artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Reject generated files and credentials
        uses: actions/github-script@v9
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100
            });

            const forbidden = [
              { pattern: /(^|\/)config\.ini$/i, reason: 'runtime configuration' },
              { pattern: /(^|\/)\.env$/i, reason: 'environment secrets' },
              { pattern: /(^|\/)__pycache__(\/|$)|\.py[co]$/i, reason: 'Python bytecode' },
              { pattern: /(^|\/)logs?(\/|$)|\.log$/i, reason: 'runtime logs' },
              { pattern: /\.(pem|key|p12|pfx|jks)$/i, reason: 'private key material' },
              { pattern: /\.(zip|7z|rar|tar|tgz|gz|whl|exe|dll|so|dylib)$/i, reason: 'binary or archive artifact' },
              { pattern: /(^|\/)(dist|build|coverage|htmlcov)(\/|$)/i, reason: 'generated build output' }
            ];

            const violations = [];
            for (const file of files) {
              if (file.status === 'removed') continue;
              for (const rule of forbidden) {
                if (rule.pattern.test(file.filename)) {
                  violations.push(`- \`${file.filename}\` (${rule.reason})`);
                  break;
                }
              }
            }

            if (violations.length) {
              core.setFailed(`Remove these generated or sensitive files from the PR:\n${violations.join('\n')}`);
            }

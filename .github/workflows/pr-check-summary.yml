name: PR Check Summary

# Posts a single "CI Results" comment on the PR listing every check on its
# latest commit, with an explanation for each failure. It runs after each PR
# workflow finishes, so the comment fills in as checks complete.
#
# workflow_run always uses this file and the script from the default branch,
# and the job never checks out or runs code from the pull request.
on:
  workflow_run:
    workflows:
      - CI
      - PR
      - PR Artifacts
      - Security
      - Semantic PR Title
      - release-contract
      - Build Docker image
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-check-summary-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  summarize:
    name: summarize all PR checks
    if: >-
      github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Check out summary script from the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Summarize checks and explain failures
        uses: actions/github-script@v9
        with:
          script: |
            const summarize = require('./.github/scripts/summarize-pr-checks.cjs');
            await summarize({github, context, core});

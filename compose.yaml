services:
  missionchiefbot:
    build:
      context: .
    image: missionchiefbotx:latest
    env_file:
      - .env
    environment:
      MISSIONCHIEF_WEBUI_ENABLED: ${MISSIONCHIEF_WEBUI_ENABLED:-true}
      MISSIONCHIEF_WEBUI_HOST: 0.0.0.0
      MISSIONCHIEF_WEBUI_PORT: ${MISSIONCHIEF_WEBUI_PORT:-8765}
    ports:
      - "${MISSIONCHIEF_WEBUI_BIND:-127.0.0.1}:${MISSIONCHIEF_WEBUI_PORT:-8765}:${MISSIONCHIEF_WEBUI_PORT:-8765}"
    volumes:
      - ./logs:/app/logs
    init: true
